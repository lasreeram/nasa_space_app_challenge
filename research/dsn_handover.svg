<text x="40" y="650" fill="#f2c94c" font-size="13">Windows overlap, so the next site can lock on before the current one loses the spacecraft.</text>
<text x="40" y="674" fill="#f2c94c" font-size="13">Simplified model: spacecraft on the celestial equator, flat horizon (0° elevation), steady 15°/hour rotation.</text>
<text x="40" y="698" fill="#f2c94c" font-size="13">Real passes are shorter and differ with the spacecraft's position in the sky, and the station order repeats every day.</text>
